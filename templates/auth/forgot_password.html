{% extends "base.html" %}

{% block title %}Quên mật khẩu | {{ store_name }}{% endblock %}

{% block content %}
<div class="login-border forgot-password-border">
    <div class="Avatar">
        <div class="head"></div>
        <div class="body"></div>
    </div>

    <h1 class="login">QUÊN MẬT KHẨU</h1>

    <form action="{{ url_for('forgot_password') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="username">
            <label for="username_id">Tên đăng nhập</label>
            <input
                type="text"
                id="username_id"
                name="username"
                placeholder="Tên đăng nhập"
                required
            >
        </div>

        <div class="password">
            <label for="old_password_id">Mật khẩu cũ</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="old_password_id"
                    name="old_password"
                    placeholder="Mật khẩu cũ"
                    required
                >
                <button class="password-visibility-toggle" type="button" aria-controls="old_password_id" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-visibility-slash" d="m3 3 18 18"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="password">
            <label for="new_password_id">Mật khẩu mới</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="new_password_id"
                    name="password"
                    placeholder="Mật khẩu mới"
                    required
                >
                <button class="password-visibility-toggle" type="button" aria-controls="new_password_id" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-visibility-slash" d="m3 3 18 18"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="password">
            <label for="confirm_password_id">Xác nhận mật khẩu</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="confirm_password_id"
                    name="confirm_password"
                    placeholder="Xác nhận mật khẩu"
                    required
                >
                <button class="password-visibility-toggle" type="button" aria-controls="confirm_password_id" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-visibility-slash" d="m3 3 18 18"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="button">
            <button class="login_button" type="submit">
                Đặt lại mật khẩu
            </button>
        </div>
    </form>

    <div class="login-option">
        <a href="{{ url_for('login') }}">Quay lại đăng nhập</a>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Đăng ký | {{ store_name }}{% endblock %}

{% block content %}
<div class="register-border">
  <h1 class="register">ĐĂNG KÝ</h1>

  <form action="{{ url_for('register') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="fullname">
      <label for="full_name">Họ và tên</label>
      <input
        type="text"
        id="full_name"
        name="full_name"
        maxlength="100"
        autocomplete="name"
        required
      >
    </div>

    <div class="phonenumber">
      <label for="phone">Số điện thoại</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        maxlength="15"
        autocomplete="tel"
      >
    </div>

    <div class="Email">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        maxlength="100"
        autocomplete="email"
      >
    </div>

    <div class="address">
      <label for="address">Địa chỉ</label>
      <input
        type="text"
        id="address"
        name="address"
        maxlength="255"
        autocomplete="street-address"
      >
    </div>

    <div class="username">
      <label for="username">Tên đăng nhập</label>
      <input
        type="text"
        id="username"
        name="username"
        maxlength="50"
        autocomplete="username"
        required
      >
    </div>

    <div class="password">
      <label for="password">Mật khẩu</label>
      <div class="password-input-wrapper">
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          autocomplete="new-password"
          required
        >
        <button class="password-visibility-toggle" type="button" aria-controls="password" aria-label="Hiện mật khẩu" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path class="password-visibility-slash" d="m3 3 18 18"></path>
          </svg>
        </button>
      </div>
      <label for="confirm_password">Xác nhận mật khẩu</label>
      <div class="password-input-wrapper">
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          minlength="8"
          autocomplete="new-password"
          required
        >
        <button class="password-visibility-toggle" type="button" aria-controls="confirm_password" aria-label="Hiện mật khẩu" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path class="password-visibility-slash" d="m3 3 18 18"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="button">
      <button class="register_button" type="submit">Đăng ký</button>
    </div>
  </form>

  <div class="login-option register-login-option">
    <p>Bạn đã có tài khoản?</p>
    <a href="{{ url_for('login') }}">Đăng nhập</a>
  </div>
</div>
{% endblock %}

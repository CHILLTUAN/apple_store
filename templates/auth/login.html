
{% extends "base.html" %}

{% block title %}Đăng nhập | {{ store_name }}{% endblock %}

{% block content %}
<div class="login-border">

    <div class="Avatar">
        <div class="head"></div>
        <div class="body"></div>
    </div>

    <h1 class="login">ĐĂNG NHẬP</h1>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="username">
            <label for="username_id">Tên đăng nhập</label>
            <input
                type="text"
                id="username_id"
                name="username"
                placeholder="Tên đăng nhập"
                required
            >
        </div>

        <div class="password">
            <label for="password_id">Mật khẩu</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="password_id"
                    name="password"
                    placeholder="Mật khẩu"
                    required
                >
                <button class="password-visibility-toggle" type="button" aria-controls="password_id" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="password-visibility-slash" d="m3 3 18 18"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="option">
            <div class="forgot-password-group">
                <a href="{{ url_for('forgot_password') }}">Quên mật khẩu?</a>
            </div>
        </div>

        <div class="button">
            <button class="login_button" type="submit">
                Đăng nhập
            </button>
        </div>

    </form>

    <div class="login-option">
        <p>Bạn chưa có tài khoản?<p>
        <a href="{{ url_for('register') }}">Đăng ký ngay.</a>
    </div>
    <p class="admin-login-note">Quản trị viên và nhân viên bán hàng sẽ được chuyển đến đúng trang làm việc sau khi đăng nhập.</p>

</div>
{% endblock %}

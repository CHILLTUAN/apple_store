{% extends "admin/base.html" %}
{% block admin_content %}
<div class="page-heading"><div><p class="eyebrow"><a href="{{ url_for('admin.users') }}">NGƯỜI DÙNG</a> / {{ "CHỈNH SỬA" if user else "THÊM MỚI" }}</p><h1>{{ title }}</h1><p class="page-subtitle">Mật khẩu luôn được lưu dưới dạng băm, không lưu văn bản thuần.</p></div></div>
<form class="panel form-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-grid">
    <label class="field">Họ và tên<input name="full_name" required maxlength="100" value="{{ user.full_name if user else form_values.full_name }}"></label>
    <label class="field">Tên đăng nhập<input name="username" required maxlength="50" value="{{ user.username if user else form_values.username }}"></label>
    <label class="field">Email<input type="email" name="email" maxlength="100" value="{{ user.email if user else form_values.email }}"></label>
    <label class="field">Số điện thoại<input name="phone" maxlength="15" value="{{ user.phone if user else form_values.phone }}"></label>
    <label class="field field-wide">Địa chỉ<input name="address" maxlength="255" value="{{ user.address if user else form_values.address }}"></label>
    <label class="field">{{ "Mật khẩu mới (để trống nếu không đổi)" if user else "Mật khẩu" }}
      <span class="password-input-wrap">
        <input id="user-password" type="password" name="password" {% if not user %}required{% endif %} minlength="8" autocomplete="new-password">
        <button
          class="password-toggle"
          type="button"
          data-password-toggle="user-password"
          aria-label="Hiện mật khẩu"
          aria-pressed="false"
        >
          <svg class="password-eye-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="password-eye-off-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
            <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
          </svg>
        </button>
      </span>
    </label>
    <label class="field">Vai trò<select name="role"><option value="1" {% if (user and user.role == 1) or (not user and form_values.role == 1) %}selected{% endif %}>Quản trị viên</option><option value="2" {% if (user and user.role == 2) or (not user and form_values.role == 2) %}selected{% endif %}>Nhân viên</option><option value="3" {% if (user and user.role == 3) or (not user and form_values.role == 3) %}selected{% endif %}>Khách hàng</option></select></label>
    {% if user %}<label class="field field-wide">Trạng thái<select name="is_active"><option value="1" {% if user.is_active %}selected{% endif %}>Đang hoạt động</option><option value="0" {% if not user.is_active %}selected{% endif %}>Đã khóa</option></select></label>{% endif %}
  </div>
  <div class="form-actions"><a class="button button-light" href="{{ url_for('admin.users') }}">Hủy</a><button class="button button-dark" type="submit">Lưu người dùng</button></div>
</form>
{% endblock %}

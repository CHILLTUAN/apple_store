{% extends "base.html" %}

{% block title %}Thay đổi thông tin | {{ store_name }}{% endblock %}

{% block content %}
<section class="customer-account">
  <h1>Thay đổi thông tin cá nhân</h1>

  <form class="customer-profile-form" action="{{ url_for('edit_customer_account') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="full_name">Họ và tên</label>
    <input id="full_name" name="full_name" maxlength="100" value="{{ customer.full_name }}" required>

    <label for="phone">Số điện thoại</label>
    <input id="phone" name="phone" type="tel" maxlength="15" value="{{ customer.phone or '' }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="100" value="{{ customer.email or '' }}">

    <label for="address">Địa chỉ</label>
    <input id="address" name="address" maxlength="255" value="{{ customer.address or '' }}">

    <div class="customer-account-actions">
      <button class="buy-product-button" type="submit">Lưu thay đổi</button>
      <a class="customer-cancel-button" href="{{ url_for('customer_account') }}">Hủy</a>
    </div>
  </form>
</section>
{% endblock %}
